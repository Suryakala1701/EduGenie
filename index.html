<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EduGenie</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
    background: #f4f6f8;
  }
  h1 {
    text-align: center;
    color: #2c3e50;
  }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .tab-btn {
    padding: 10px 15px;
    border: none;
    background: #ddd;
    cursor: pointer;
    border-radius: 5px;
  }
  .tab-btn.active {
    background: #3498db;
    color: white;
  }
  textarea, input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    box-sizing: border-box;
  }
  button.action {
    margin-top: 10px;
    padding: 10px 20px;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  #output {
    margin-top: 20px;
    background: white;
    padding: 15px;
    border-radius: 5px;
    white-space: pre-wrap;
    min-height: 50px;
    border: 1px solid #ddd;
  }
</style>
</head>
<body>

<h1>EduGenie</h1>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('ask')">Ask</button>
  <button class="tab-btn" onclick="showTab('quiz')">Quiz</button>
  <button class="tab-btn" onclick="showTab('recommend')">Learning Path</button>
  <button class="tab-btn" onclick="showTab('summarize')">Summarize</button>
</div>

<div id="ask" class="tab-content">
  <textarea id="askInput" rows="3" placeholder="Ask a question..."></textarea>
  <button class="action" onclick="callAsk()">Ask</button>
</div>

<div id="quiz" class="tab-content" style="display:none">
  <input id="quizInput" placeholder="Enter a topic for the quiz">
  <button class="action" onclick="callQuiz()">Generate Quiz</button>
</div>

<div id="recommend" class="tab-content" style="display:none">
  <input id="recommendInput" placeholder="Enter a topic for learning path">
  <button class="action" onclick="callRecommend()">Get Learning Path</button>
</div>

<div id="summarize" class="tab-content" style="display:none">
  <textarea id="summarizeInput" rows="5" placeholder="Paste text to summarize..."></textarea>
  <button class="action" onclick="callSummarize()">Summarize</button>
</div>

<div id="output">Answers will appear here.</div>

<script>
const BASE_URL = "http://127.0.0.1:8000";

function showTab(id) {
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.getElementById(id).style.display = 'block';
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
}

async function callAsk() {
  const question = document.getElementById('askInput').value;
  document.getElementById('output').innerText = "Thinking...";
  const res = await fetch(BASE_URL + "/ask", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({question})
  });
  const data = await res.json();
  document.getElementById('output').innerText = data.answer;
}

async function callQuiz() {
  const topic = document.getElementById('quizInput').value;
  document.getElementById('output').innerText = "Generating quiz...";
  const res = await fetch(BASE_URL + "/generate-quiz", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({topic})
  });
  const data = await res.json();
  document.getElementById('output').innerText = data.quiz;
}

async function callRecommend() {
  const topic = document.getElementById('recommendInput').value;
  document.getElementById('output').innerText = "Building learning path...";
  const res = await fetch(BASE_URL + "/recommend", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({topic})
  });
  const data = await res.json();
  document.getElementById('output').innerText = data.learning_path;
}

async function callSummarize() {
  const text = document.getElementById('summarizeInput').value;
  document.getElementById('output').innerText = "Summarizing...";
  const res = await fetch(BASE_URL + "/summarize", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({text})
  });
  const data = await res.json();
  document.getElementById('output').innerText = data.summary;
}
</script>

</body>
</html>
